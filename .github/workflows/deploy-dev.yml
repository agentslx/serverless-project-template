name: deploy-dev

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-lambda
      - working-directory: backend
        run: cargo lambda build --release --workspace
      - uses: actions/upload-artifact@v4
        with: { name: lambda-artifacts, path: backend/target/lambda/ }

  build-user-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'yarn', cache-dependency-path: frontend/yarn.lock }
      - working-directory: frontend
        run: yarn install --frozen-lockfile
      - working-directory: frontend
        env: { REACT_APP_FLAVOR: dev }
        run: yarn build
      - uses: actions/upload-artifact@v4
        with: { name: user-fe-build, path: frontend/build/ }

  build-admin-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'yarn', cache-dependency-path: admin-frontend/yarn.lock }
      - working-directory: admin-frontend
        run: yarn install --frozen-lockfile
      - working-directory: admin-frontend
        env: { REACT_APP_FLAVOR: dev }
        run: yarn build
      - uses: actions/upload-artifact@v4
        with: { name: admin-fe-build, path: admin-frontend/build/ }

  deploy:
    needs: [build-backend, build-user-fe, build-admin-fe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lambda-artifacts, path: backend/target/lambda/ }
      - uses: actions/download-artifact@v4
        with: { name: user-fe-build, path: frontend/build/ }
      - uses: actions/download-artifact@v4
        with: { name: admin-fe-build, path: admin-frontend/build/ }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r iac/requirements.txt
      - uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: iac
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
