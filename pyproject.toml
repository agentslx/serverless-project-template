[project]
name = "serverless-system-template"
version = "0.1.0"
description = "Reusable serverless project template for AWS — Python backend, React/Next.js frontends, Pulumi IaC"
requires-python = ">=3.11"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.uv.workspace]
members = ["backend", "infrastructure"]
