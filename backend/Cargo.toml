[workspace]
resolver = "2"
members = [
    # ---- shared (Rust) ----
    "shared/entities_rs",
    "shared/modules_rs/database",
    "shared/modules_rs/common",

    # ---- feature: auth (Rust) ----
    "feature/auth_rs",
    "feature/auth_rs/presentation/lambda_handlers/get_me",
    "feature/auth_rs/presentation/lambda_handlers/post_confirmation_trigger",

    # ---- feature: user_profile (Rust) ----
    "feature/user_profile_rs",
    "feature/user_profile_rs/presentation/lambda_handlers/user_profile_handler",

    # ---- feature: admin (Rust) ----
    "feature/admin_rs",
    "feature/admin_rs/presentation/lambda_handlers/list_users",

    # ---- local proxy ----
    "local_proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt"] }

# Lambda runtimes
lambda_http     = "0.13"
lambda_runtime  = "0.13"
aws_lambda_events = "0.16"

# AWS SDK
aws-config       = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"

# Serde
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Errors / logging
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry        = { version = "0.31", features = ["trace"] }
opentelemetry_sdk    = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-aws    = "0.19"
tracing-opentelemetry = "0.32"

# Misc
async-trait = "0.1"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
once_cell   = "1"
base64      = "0.22"

# Local proxy only
axum        = "0.7"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace"] }
hyper       = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
matchit     = "0.7"

# Test
mockall = "0.13"

# Workspace member shortcuts
shared_entities_rs        = { path = "shared/entities_rs" }
shared_database_rs        = { path = "shared/modules_rs/database" }
shared_common_rs          = { path = "shared/modules_rs/common" }
feature_auth_rs           = { path = "feature/auth_rs" }
feature_user_profile_rs   = { path = "feature/user_profile_rs" }
feature_admin_rs          = { path = "feature/admin_rs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
