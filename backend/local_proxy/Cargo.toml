[package]
name        = "local_proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "local_proxy"
path = "src/main.rs"

[dependencies]
tokio       = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum        = { workspace = true }
tower       = { workspace = true }
tower-http  = { workspace = true }
hyper       = { workspace = true }
http        = "1"
matchit     = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }

# In-process Rust handlers — the proxy links the feature crates directly so
# requests to `language: "rust"` routes never go over the network.
shared_entities_rs       = { workspace = true }
shared_database_rs       = { workspace = true }
feature_auth_rs          = { workspace = true }
feature_user_profile_rs  = { workspace = true }
feature_admin_rs         = { workspace = true }
